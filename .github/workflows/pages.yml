name: Pubblica PWA su GitHub Pages (alternativa a Cloudflare)

# Il sito è pubblicato su Cloudflare Pages, che si aggiorna da solo a ogni commit.
# Questo workflow resta disponibile solo come alternativa manuale.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Prepara sito
        run: |
          bash scripts/build-site.sh
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
