name: Aggiorna catalogo MakerWorld

on:
  schedule:
    - cron: '*/30 * * * *'   # ogni 30 minuti (GitHub può ritardare l'avvio di qualche minuto)
  workflow_dispatch:
    inputs:
      full:
        description: 'Analizza tutte le categorie (più lento)'
        type: boolean
        default: false
      debug:
        description: 'Salva screenshot e log di debug'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Installa dipendenze
        working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Test algoritmo di selezione
        working-directory: scraper
        run: npm test

      - name: Test coda articoli
        run: node --test lib/server/queue.test.mjs

      - name: Analizza MakerWorld e invia il catalogo al sito
        working-directory: scraper
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          SCRAPE_ALL: ${{ inputs.full && '1' || '0' }}
          SCRAPER_DEBUG: ${{ inputs.debug && '1' || '0' }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$INGEST_TOKEN" ]; then
            echo "::error::Configura la variabile SITE_URL e il secret INGEST_TOKEN (vedi README)."
            exit 1
          fi
          npm run scrape

      - name: Debug
        if: ${{ always() && inputs.debug }}
        uses: actions/upload-artifact@v7
        with:
          name: scraper-debug
          path: scraper/debug/
          if-no-files-found: ignore
