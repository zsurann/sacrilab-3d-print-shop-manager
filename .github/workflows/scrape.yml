name: Aggiorna catalogo MakerWorld

on:
  schedule:
    - cron: '17 5,11,17 * * *'   # 3 volte al giorno (UTC)
  workflow_dispatch:
    inputs:
      debug:
        description: 'Salva screenshot e log di debug'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Installa dipendenze
        working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Test algoritmo di selezione
        working-directory: scraper
        run: npm test

      - name: Analizza MakerWorld
        working-directory: scraper
        env:
          SCRAPER_DEBUG: ${{ inputs.debug && '1' || '0' }}
        run: npm run scrape

      - name: Salva catalogo
        run: |
          if git diff --quiet -- data/products.json; then
            echo "Nessuna modifica al catalogo."
            exit 0
          fi
          git config user.name "sacrilab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git commit -m "chore(catalogo): aggiornamento automatico MakerWorld"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Debug
        if: ${{ always() && inputs.debug }}
        uses: actions/upload-artifact@v7
        with:
          name: scraper-debug
          path: scraper/debug/
          if-no-files-found: ignore
